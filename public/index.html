<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fazer Pedido</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
    .card { max-width: 560px; margin: 0 auto; padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 10px; background: #111; color: #fff; cursor: pointer; }
    .ok { color: #0a7c2f; margin-top: 8px; }
    .err { color: #b00020; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pedido do Bar</h1>
    <form id="orderForm">
      <label>Mesa</label>
      <input type="number" id="table" min="1" required placeholder="Ex: 12">
      <label>Itens</label>
      <textarea id="items" rows="5" required placeholder="Ex: 2x chopp pilsen, 1x porção de fritas"></textarea>
      <label>Observações</label>
      <textarea id="notes" rows="3" placeholder="Ex: sem sal, ponto da carne"></textarea>
      <button type="submit">Enviar pedido</button>
      <div id="msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('orderForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = '';
      try {
        const payload = {
          table: document.getElementById('table').value,
          items: document.getElementById('items').value,
          notes: document.getElementById('notes').value
        };
        const res = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        msg.textContent = `Pedido enviado. Nº ${data.id.slice(-6)}`;
        msg.className = 'ok';
        form.reset();
      } catch (err) {
        msg.textContent = 'Erro ao enviar o pedido.';
        msg.className = 'err';
      }
    });
  </script>
</body>
</html>
